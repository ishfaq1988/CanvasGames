<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Neon Pong</title>
<style>html,body{margin:0;height:100%;background:#05060d}#game{position:fixed;inset:0}</style>
</head>
<body>
<div id="game"></div>
<script src="../lib/p2p.js"></script>
<script src="../lib/shell.js"></script>
<script>
(function () {
  'use strict';
  var U = GameShell.utils;
  var W = 800, H = 500;
  var PAD_W = 12, PAD_H = 90, PAD_X = 34, PAD_SPEED = 520, POINTER_SPEED = 1100;
  var BALL_R = 8, BALL_SPEED = 400, BALL_MAX = 950;
  var WIN_SCORE = 7;
  var COLORS = ['#3cf', '#f4a'];

  function serve(s, toward) {
    s.ball = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
    s.serveIn = 0.9;
    s.serveDir = toward;
  }

  function movePaddle(s, i, inp, dt) {
    var p = s.pads[i];
    if (!inp) return;
    if (inp.y !== null && inp.y !== undefined) {
      var d = inp.y - p.y;
      var max = POINTER_SPEED * dt;
      p.y += U.clamp(d, -max, max);
    } else {
      p.y += (inp.d || 0) * PAD_SPEED * dt;
    }
    p.y = U.clamp(p.y, PAD_H / 2, H - PAD_H / 2);
  }

  function hitPaddle(s, i, api) {
    var b = s.ball, p = s.pads[i];
    var px = i === 0 ? PAD_X : W - PAD_X;
    var facing = i === 0 ? b.vx < 0 : b.vx > 0;
    if (!facing) return;
    if (Math.abs(b.x - px) > PAD_W / 2 + BALL_R) return;
    if (Math.abs(b.y - p.y) > PAD_H / 2 + BALL_R) return;
    var off = U.clamp((b.y - p.y) / (PAD_H / 2), -1, 1);
    var angle = off * (Math.PI / 3.2);
    var speed = Math.min(BALL_MAX, Math.hypot(b.vx, b.vy) * 1.06);
    var dir = i === 0 ? 1 : -1;
    b.vx = Math.cos(angle) * speed * dir;
    b.vy = Math.sin(angle) * speed;
    b.x = px + dir * (PAD_W / 2 + BALL_R);
    s.flash[i] = 1;
    s.hits++;
    api.sfx('hit');
  }

  var def = {
    id: 'pong',
    title: 'Neon Pong',
    tagline: 'First to ' + WIN_SCORE + ' points wins.',
    width: W,
    height: H,
    mouseHover: true,
    players: [{ name: 'Blue', color: COLORS[0], side: 'left' }, { name: 'Pink', color: COLORS[1], side: 'right' }],
    controls: {
      cpu: 'W/S, ↑/↓, mouse or touch',
      local: 'Blue W/S · Pink ↑/↓ · touch your half',
      online: 'W/S, ↑/↓, mouse or touch'
    },
    sounds: {
      hit: [520, 0.06, 'square', 0.07],
      wall: [300, 0.04, 'square', 0.05],
      score: [180, 0.35, 'sawtooth', 0.06, 70],
      go: [660, 0.15, 'triangle', 0.08],
      win: [440, 0.6, 'triangle', 0.09, 880]
    },

    init: function () {
      var s = {
        pads: [{ y: H / 2 }, { y: H / 2 }],
        score: [0, 0],
        flash: [0, 0],
        hits: 0
      };
      serve(s, Math.random() < 0.5 ? -1 : 1);
      return s;
    },

    readInput: function (inp) {
      var d = (inp.held('down') ? 1 : 0) - (inp.held('up') ? 1 : 0);
      var y = null;
      for (var i = 0; i < inp.pointers.length; i++) {
        var p = inp.pointers[i];
        // On a shared screen each player steers with a finger on their half.
        if (inp.scheme === 'p1' && p.x > W / 2) continue;
        if (inp.scheme === 'p2' && p.x < W / 2) continue;
        y = p.y;
      }
      // Keys win over a resting mouse cursor.
      return { d: d, y: y === null || d !== 0 ? null : Math.round(y) };
    },

    ai: function (s, i, dt) {
      var b = s.ball, p = s.pads[i];
      var target = H / 2;
      var coming = i === 1 ? b.vx > 0 : b.vx < 0;
      if (coming) {
        // Predict where the ball crosses the paddle line, folding wall bounces.
        var px = i === 1 ? W - PAD_X : PAD_X;
        var t = (px - b.x) / b.vx;
        var y = b.y + b.vy * t;
        var span = H - 2 * BALL_R;
        y = ((y - BALL_R) % (2 * span) + 2 * span) % (2 * span);
        y = (y > span ? 2 * span - y : y) + BALL_R;
        // Imperfect aim, and worse when the ball is still far away.
        s.aiErr = s.aiErr === undefined ? 0 : s.aiErr;
        if (s.hits !== s.aiHits) { s.aiHits = s.hits; s.aiErr = (Math.random() - 0.5) * 70; }
        target = y + s.aiErr * Math.min(1, t * 1.4);
      }
      var diff = target - p.y;
      return { d: Math.abs(diff) < 10 ? 0 : (diff > 0 ? 0.82 : -0.82), y: null };
    },

    step: function (s, inputs, dt, api) {
      movePaddle(s, 0, inputs[0], dt);
      movePaddle(s, 1, inputs[1], dt);
      s.flash[0] = Math.max(0, s.flash[0] - dt * 4);
      s.flash[1] = Math.max(0, s.flash[1] - dt * 4);

      var b = s.ball;
      if (s.serveIn > 0) {
        s.serveIn -= dt;
        if (s.serveIn <= 0) {
          var a = (Math.random() - 0.5) * 0.8;
          b.vx = Math.cos(a) * BALL_SPEED * s.serveDir;
          b.vy = Math.sin(a) * BALL_SPEED;
        }
        return;
      }

      // Sub-steps keep a fast ball from passing through a paddle.
      var n = Math.ceil(Math.hypot(b.vx, b.vy) * dt / (BALL_R));
      for (var k = 0; k < n; k++) {
        b.x += b.vx * dt / n;
        b.y += b.vy * dt / n;
        if (b.y < BALL_R) { b.y = BALL_R; b.vy = Math.abs(b.vy); api.sfx('wall'); }
        if (b.y > H - BALL_R) { b.y = H - BALL_R; b.vy = -Math.abs(b.vy); api.sfx('wall'); }
        hitPaddle(s, 0, api);
        hitPaddle(s, 1, api);
      }
      if (b.x < -BALL_R * 2) { s.score[1]++; api.sfx('score'); serve(s, -1); }
      else if (b.x > W + BALL_R * 2) { s.score[0]++; api.sfx('score'); serve(s, 1); }
    },

    winner: function (s) {
      if (s.score[0] >= WIN_SCORE) return 0;
      if (s.score[1] >= WIN_SCORE) return 1;
      return null;
    },

    snapshot: function (s) {
      return {
        p: [U.round(s.pads[0].y), U.round(s.pads[1].y)],
        b: [U.round(s.ball.x), U.round(s.ball.y)],
        sc: s.score,
        f: [U.round(s.flash[0], 100), U.round(s.flash[1], 100)]
      };
    },
    applySnapshot: function (prev, m) {
      return { pads: [{ y: m.p[0] }, { y: m.p[1] }], ball: { x: m.b[0], y: m.b[1] }, score: m.sc, flash: m.f };
    },
    interpolate: function (a, b, t) {
      var jump = Math.abs(a.ball.x - b.ball.x) > 150;
      return {
        pads: [{ y: U.lerp(a.pads[0].y, b.pads[0].y, t) }, { y: U.lerp(a.pads[1].y, b.pads[1].y, t) }],
        ball: jump ? b.ball : { x: U.lerp(a.ball.x, b.ball.x, t), y: U.lerp(a.ball.y, b.ball.y, t) },
        score: b.score,
        flash: b.flash
      };
    },

    render: function (ctx, s, view) {
      ctx.fillStyle = '#070914';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(140,160,255,0.18)';
      ctx.lineWidth = 4;
      ctx.setLineDash([14, 14]);
      ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = '700 64px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillText(s.score[0], W / 2 - 80, 84);
      ctx.fillText(s.score[1], W / 2 + 80, 84);

      for (var i = 0; i < 2; i++) {
        var x = i === 0 ? PAD_X : W - PAD_X;
        ctx.save();
        U.glow(ctx, COLORS[i], 18 + s.flash[i] * 30);
        ctx.fillStyle = COLORS[i];
        ctx.fillRect(x - PAD_W / 2, s.pads[i].y - PAD_H / 2, PAD_W, PAD_H);
        ctx.restore();
      }
      if (view.mode === 'host' || view.mode === 'guest') {
        ctx.fillStyle = COLORS[view.me];
        ctx.font = '600 13px system-ui,sans-serif';
        ctx.fillText('YOU', view.me === 0 ? PAD_X + 30 : W - PAD_X - 30, H - 14);
      }
      ctx.save();
      U.glow(ctx, '#fff', 20);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.ball.x, s.ball.y, BALL_R, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  };

  GameShell.start(def, '#game');
})();
</script>
</body>
</html>
